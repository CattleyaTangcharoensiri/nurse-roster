<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดตารางเวรพยาบาล</title>
<style>/* ============================================================
   จัดตารางเวรพยาบาล — ตารางคือหน้าจอ ไม่ใช่ฟอร์ม
   ============================================================ */
:root {
  --col-name: 168px;
  --col-sum: 156px;
  --col-day: 34px;
  --line: #E2E8F0;
  --ink: #1E293B;
  --muted: #64748B;
  --blue: #2563EB;
  --blue-dark: #1D4ED8;
  --weekend: #FEF2F2;
  --red: #DC2626;
  --amber: #B45309;
  --green: #15803D;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
  background: #fff;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.4;
}
button { font-family: inherit; }

.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

/* ---------- TOOLBAR ---------- */
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none;
}
.toolbar .title { font-size: 15px; font-weight: bold; }
.toolbar .spacer { flex: 1; }
.btn {
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 5px;
  background: #fff; color: var(--ink); cursor: pointer; font-size: 12px; font-weight: bold;
}
.btn:hover { background: #F8FAFC; }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: var(--blue-dark); }
.btn.on { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.nav { padding: 6px 9px; font-size: 15px; line-height: 1; color: var(--blue); }

.monthpick { display: flex; align-items: center; gap: 4px; margin-left: 14px; }
.monthpick select, .monthpick input {
  font-family: inherit; font-size: 12px; font-weight: bold; color: var(--ink);
  border: 1px solid var(--line); border-radius: 5px; padding: 6px 6px; background: #fff;
}
.monthpick select { min-width: 96px; }
.monthpick input { width: 62px; text-align: center; }

.rulepick { display: flex; align-items: center; gap: 6px; margin-left: 12px; font-size: 12px; color: var(--muted); }
.rulepick input[type="number"] {
  width: 46px; text-align: center; font-family: inherit; font-size: 12px; font-weight: bold;
  color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 6px 4px;
}
.rulepick label { display: flex; align-items: center; gap: 3px; cursor: pointer; }

/* ---------- LEGEND ---------- */
.legend {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 14px; border-bottom: 1px solid var(--line); flex: none;
}
.legend .sym {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold;
}
.legend .hint { margin-left: auto; color: var(--muted); font-size: 11px; }

/* สี token */
.t-ch  { background: #FEF3C7; color: #92400E; }
.t-b   { background: #FFE4D5; color: #9A3412; }
.t-d   { background: #DBEAFE; color: #1E40AF; }
.t-dbl { background: #FDE68A; color: #78350F; box-shadow: inset 0 0 0 1px #D97706; }
.t-R   { background: #F1F5F9; color: #64748B; }
.t-O   { background: #E2E8F0; color: #475569; }
.t-V   { background: #F3E8FF; color: #6B21A8; }
.t-T   { background: #DCFCE7; color: #166534; }

/* ---------- TABLE ---------- */
.table-wrap { flex: 1; position: relative; overflow: hidden; }
.viewport { height: 100%; overflow: auto; outline: none; }
.grid { border-collapse: separate; border-spacing: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.grid th, .grid td {
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: #fff; text-align: center; vertical-align: middle;
}
.grid .day { width: var(--col-day); min-width: var(--col-day); max-width: var(--col-day); }

thead th {
  position: sticky; top: 0; z-index: 20; background: #F8FAFC;
  height: 42px; font-size: 12px; font-weight: bold; padding: 2px;
}
.dh-num { font-size: 12px; font-weight: bold; display: block; }
.dh-dow { font-size: 10px; color: var(--muted); display: block; }
.day.wknd { background: var(--weekend); }
.day.wknd .dh-num, .day.wknd .dh-dow { color: var(--red); }
.day.bad { box-shadow: inset 0 -3px 0 var(--red); }

.col-name {
  position: sticky; left: 0; z-index: 15;
  width: var(--col-name); min-width: var(--col-name); max-width: var(--col-name);
  text-align: left; padding: 5px 8px 5px 12px;
}
tbody .col-name { position: relative; }
thead .col-name, tfoot .col-name { z-index: 30; background: #F8FAFC; }
.nm-1 { display: block; font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 44px; cursor: text; }
.rowdel {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  border: none; background: none; color: var(--muted);
  font-size: 15px; line-height: 1; cursor: pointer; padding: 0 4px; opacity: 0;
}
.rowcfg {
  position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
  border: 1px solid var(--line); background: #fff; color: var(--blue);
  font-size: 10px; font-weight: bold; line-height: 1; cursor: pointer;
  padding: 2px 4px; border-radius: 4px; opacity: 0;
}
tbody tr:hover .rowdel, tbody tr:hover .rowcfg { opacity: 1; }
.rowdel:hover { color: var(--red); }
.rowcfg:hover { background: #EFF6FF; }

.menu-head { padding: 6px 12px 5px; font-size: 11px; font-weight: bold; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu .chk { display: inline-block; width: 16px; text-align: center; }
.menu-done { justify-content: center !important; color: var(--blue) !important; font-weight: bold; border-top: 1px solid var(--line); margin-top: 4px; }
.nm-2 { display: block; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.col-sum {
  position: sticky; right: 0; z-index: 15;
  width: var(--col-sum); min-width: var(--col-sum); max-width: var(--col-sum);
  border-left: 2px solid var(--line); padding: 0; text-align: center;
}
thead .col-sum, tfoot .col-sum { z-index: 30; background: #F8FAFC; }
tfoot .col-sum { padding: 3px 8px; text-align: left; font-size: 11px; }

/* ตารางสรุปด้านขวา — เหมือน PDF: รวมวันทำงาน | ช | บ | ด | ช+บ | O+R */
.sumgrid {
  display: grid;
  grid-template-columns: 34px 22px 22px 22px 26px 30px;
  align-items: center; height: 100%;
}
.sumgrid span {
  padding: 3px 0; text-align: center; font-size: 11px; font-weight: bold;
  border-left: 1px solid var(--line); align-self: stretch;
  display: flex; align-items: center; justify-content: center;
}
.sumgrid span:first-child { border-left: none; }
.sumgrid.head span { font-size: 10px; color: var(--muted); }
.sumgrid span.z { color: #CBD5E1; font-weight: normal; }

tbody tr:nth-child(even) td.cell { background: #FCFCFD; }
td.cell { height: 34px; padding: 0; cursor: pointer; user-select: none; position: relative; }
td.cell.wknd { background: var(--weekend); }
.chip {
  display: inline-block; min-width: 20px; padding: 3px 7px;
  border-radius: 6px; font-size: 12px; font-weight: bold; line-height: 1.2;
}
.chip.empty { min-width: 0; padding: 0; color: #CBD5E1; }
td.cell.locked { box-shadow: inset 0 0 0 2px #334155; }
td.cell.locked::after {
  content: "🔒"; position: absolute; top: 0; right: 1px; font-size: 8px; line-height: 1;
}
td.cell.bad .chip { text-decoration: underline wavy var(--red); text-underline-offset: 3px; }

tfoot td {
  position: sticky; z-index: 20; background: #F8FAFC;
  height: 24px; font-size: 11px; font-weight: bold;
}
tfoot tr:nth-child(1) td { bottom: 96px; }
tfoot tr:nth-child(2) td { bottom: 72px; }
tfoot tr:nth-child(3) td { bottom: 48px; }
tfoot tr:nth-child(4) td { bottom: 24px; }
tfoot tr:nth-child(5) td { bottom: 0; }
tfoot .col-name { text-align: left; }
.cnt.under { color: var(--red); background: var(--weekend); }
.cnt.over  { color: #fff; background: var(--red); }
.cnt.ok    { color: var(--green); }

/* ---------- EMPTY ---------- */
.empty { display: none; flex-direction: column; align-items: center; gap: 12px; padding: 80px 20px; }
.empty.show { display: flex; }
.empty p { color: var(--muted); font-size: 14px; margin: 0; }

/* ---------- REPORT ---------- */
.report {
  position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
  background: #fff; border-top: 2px solid var(--line);
  display: flex; flex-direction: column; z-index: 60;
  box-shadow: 0 -8px 24px rgba(0,0,0,.08);
}
.report[hidden] { display: none; }
.report .rp-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; border-bottom: 1px solid var(--line); flex: none;
}
.report .rp-head b { font-size: 13px; }
.report .rp-body { flex: 1; overflow: auto; display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 12px; padding: 12px 14px; }
.rp-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.rp-card h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
.rp-stat { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.rp-stat b { font-size: 18px; }
.rp-stat b.warn { color: var(--red); }
.rp-stat span { font-size: 11px; color: var(--muted); }
.rp-line { padding: 5px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 4px; background: #F8FAFC; }
.rp-line.error { background: #FEF2F2; color: #991B1B; }
.rp-line.warn { background: #FFFBEB; color: #92400E; }
.rp-ok { font-size: 11px; color: var(--green); }
.pill { display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: bold; }
.pill.good { background: #DCFCE7; color: #166534; }
.pill.bad { background: #FEE2E2; color: #991B1B; }

/* ---------- MENU / TOAST ---------- */
.menu {
  position: fixed; min-width: 132px; background: #fff;
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 0; z-index: 300;
  box-shadow: 0 6px 20px rgba(0,0,0,.14);
}
.menu[hidden] { display: none; }
.menu button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 6px 12px; background: none; border: none; cursor: pointer; font-size: 12px; color: var(--ink);
}
.menu button:hover { background: #F1F5F9; }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 6px;
  font-size: 12px; z-index: 400;
}
.toast[hidden] { display: none; }

/* ---------- TOUCH / RESPONSIVE ---------- */
td.cell, tbody td.col-name {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
td.cell { touch-action: manipulation; }
.viewport { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.menu { max-height: 80vh; overflow-y: auto; }

/* อุปกรณ์สัมผัส: ไม่มี hover — ปุ่มจัดการแถวต้องโชว์ตลอด, เมนูแตะง่ายขึ้น */
@media (hover: none) {
  .rowdel, .rowcfg { opacity: 1; }
  .menu button { padding: 10px 12px; }
  .legend .hint { margin-left: 0; }
}

/* จอเล็ก (มือถือ) */
@media (max-width: 820px) {
  :root { --col-name: 128px; --col-sum: 116px; }
  body { font-size: 13px; }

  .toolbar { gap: 6px; padding: 8px 10px; }
  .toolbar .title { width: 100%; font-size: 14px; margin-bottom: 2px; }
  .toolbar .spacer { display: none; }
  .monthpick, .rulepick { margin-left: 0; }
  .rulepick { width: 100%; flex-wrap: wrap; }
  .btn { padding: 8px 10px; }

  /* ปุ่ม/ช่องกรอก ≥16px กัน iOS ซูมตอนโฟกัส */
  .monthpick select, .monthpick input,
  .rulepick input[type="number"] { font-size: 16px; }
  .monthpick input { width: 76px; }
  .rulepick input[type="number"] { width: 52px; }

  .sumgrid { grid-template-columns: 26px 18px 18px 18px 18px 18px; }
  .sumgrid span { font-size: 10px; }
  .sumgrid.head span { font-size: 9px; }
  .nm-1, .nm-2 { padding-right: 44px; }
  .nm-1 { font-size: 12px; }
  .rowcfg { right: 20px; }

  .report { height: 72%; }
  .report .rp-body { grid-template-columns: 1fr; }
}

/* ---------- PRINT ---------- */
@media print {
  .toolbar, .legend, .report, .menu, .toast { display: none !important; }
  .app, .table-wrap, .viewport { height: auto; overflow: visible; }
  thead th, tbody .col-name, .col-sum, tfoot td { position: static; }
}
</style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="title" id="title">จัดตารางเวรพยาบาล</div>
    <div class="monthpick">
      <button class="btn nav" data-act="prevMonth" title="เดือนก่อนหน้า" aria-label="เดือนก่อนหน้า">‹</button>
      <select id="selMonth" title="เดือน"></select>
      <input id="selYear" type="number" min="2500" max="2650" step="1" title="พ.ศ.">
      <button class="btn nav" data-act="nextMonth" title="เดือนถัดไป" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="rulepick" title="จำนวนคนต่อกะต่อวัน">
      <span>คน/กะ</span>
      <label>ช <input id="selTargetCh" type="number" min="0" max="99" step="1"></label>
      <label>บ <input id="selTargetB" type="number" min="0" max="99" step="1"></label>
      <label>ด <input id="selTargetD" type="number" min="0" max="99" step="1"></label>
    </div>
    <div class="rulepick" title="วันหยุด O+R ต่อคน">
      <span>หยุด O+R/คน</span>
      <input id="selQuota" type="number" min="0" max="31" step="1">
      <label><input id="selExact" type="checkbox"> เป๊ะ (ห้ามขาด/เกิน)</label>
    </div>
    <div class="rulepick" title="เพดานจำนวนวันที่ขึ้น 2 กะ/วัน ต่อคน">
      <span>2 กะ/วัน ≤/คน</span>
      <input id="selMaxDbl" type="number" min="0" max="15" step="1">
    </div>
    <div class="spacer"></div>
    <button class="btn" data-act="addStaff">+ พยาบาล</button>
    <button class="btn" data-act="sample">โหลดตัวอย่าง</button>
    <button class="btn" data-act="open">เปิดไฟล์ (JSON/CSV)</button>
    <button class="btn" data-act="save">บันทึก JSON</button>
    <button class="btn" data-act="exportXlsx">ออก Excel</button>
    <button class="btn" data-act="exportCsv">ออก CSV</button>
    <button class="btn" data-act="print">พิมพ์</button>
    <button class="btn" data-act="clear">ล้าง</button>
    <button class="btn" data-act="report" id="reportBtn">รายงาน</button>
    <button class="btn btn-primary" data-act="solve" id="solveBtn">จัดตารางอัตโนมัติ</button>
  </header>

  <div class="legend" id="legend"></div>

  <main class="table-wrap">
    <div class="viewport" id="viewport">
      <table class="grid" id="grid">
        <thead></thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
      <div class="empty" id="empty">
        <p>ไม่มีแถวพยาบาล</p>
        <button class="btn btn-primary" data-act="addStaff">+ เพิ่มพยาบาล</button>
        <button class="btn" data-act="sample">โหลดตัวอย่าง</button>
        <button class="btn" data-act="open">เปิดไฟล์ .json</button>
      </div>
    </div>
  </main>

  <section class="report" id="report" hidden></section>
</div>

<input type="file" id="file" accept=".json,.csv,application/json,text/csv" hidden>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>// ============================================================================
// model.js — โครงสร้างข้อมูล + ค่าคงที่
//
// JS บริสุทธิ์ ห้ามแตะ DOM (ต้อง import ด้วย node ได้ตรง ๆ)
//
// แนวคิดสำคัญ:
//   - engine ผูกกับปฏิทินจริงเฉพาะผ่าน `days` + `firstWeekday` เท่านั้น
//     (year/month เป็นข้อมูลเสริมของ UI — engine ไม่อ่าน)
//   - วันในโค้ด engine เป็น dayIndex 0-based; ไฟล์บันทึกใช้เลขวันที่ 1-based
// ============================================================================

/** กะทำงาน */
const SHIFT = { MORNING: 'ช', AFTERNOON: 'บ', NIGHT: 'ด' };

/** สถานะไม่ขึ้นเวรปกติ
 *   R = หยุดที่คนล็อกเอง (locked off)
 *   O = หยุดที่ระบบเติมให้ครบโควตา (auto-off ที่ solver ใส่) — นับเป็นวันหยุดเหมือน R
 *   V = ลา
 *   T = อบรม
 */
const OFF = { LOCKED: 'R', FILLED: 'O', LEAVE: 'V', TRAINING: 'T' };

const SHIFT_VALUES = [SHIFT.MORNING, SHIFT.AFTERNOON, SHIFT.NIGHT];
const OFF_VALUES = [OFF.LOCKED, OFF.FILLED, OFF.LEAVE, OFF.TRAINING];

/** ทั้ง R และ O ถือเป็น "วันหยุด" ในการนับโควตา/วันทำงาน */
const OFF_AS_REST = [OFF.LOCKED, OFF.FILLED];

/** ลำดับกะที่ถือว่า "หมุนไปข้างหน้า": ช → บ → ด */
const ROTATION_ORDER = [SHIFT.MORNING, SHIFT.AFTERNOON, SHIFT.NIGHT];

// ---- ปฏิทินไทย: อาทิตย์ = 0 (ตรงกับ Date.getDay()) ----
const WEEKDAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const WEEKDAY_SHORT = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const WEEKEND_INDICES = [0, 6]; // อาทิตย์, เสาร์

const WEEKDAY_ALIASES = {
  'พฤหัส': 'พฤหัสบดี',
  'พฤหัสฯ': 'พฤหัสบดี',
  'อาทิตย': 'อาทิตย์',
};

/** ชื่อวัน (ไทย, รับ alias สั้น) → index 0..6 */
function weekdayIndex(name) {
  if (typeof name === 'number') {
    if (name >= 0 && name <= 6) return name;
    throw new Error(`weekday index นอกช่วง: ${name}`);
  }
  const key = String(name).trim();
  const canonical = WEEKDAY_ALIASES[key] || key;
  const idx = WEEKDAYS.indexOf(canonical);
  if (idx === -1) throw new Error(`ไม่รู้จักชื่อวัน: "${name}"`);
  return idx;
}

// ---------------------------------------------------------------------------
// CELL
// ---------------------------------------------------------------------------

/** ช่องในตาราง — ทำงาน (shifts) กับ หยุด (off) เป็น exclusive กัน */
function makeCell() {
  return { shifts: [], off: null, locked: false };
}

function isWorking(cell) { return cell.shifts.length > 0; }
function isOff(cell) { return cell.off !== null; }
function isEmpty(cell) { return cell.shifts.length === 0 && cell.off === null; }
function isDouble(cell) { return cell.shifts.length >= 2; }
function isRest(cell) { return OFF_AS_REST.includes(cell.off); }
function isLeave(cell) { return cell.off === OFF.LEAVE; }
function isTraining(cell) { return cell.off === OFF.TRAINING; }

/** ตั้งเป็นกะทำงาน (ล้าง off) */
function setCellShifts(cell, shifts) {
  const list = Array.isArray(shifts) ? shifts : [shifts];
  for (const s of list) {
    if (!SHIFT_VALUES.includes(s)) throw new Error(`ค่ากะไม่ถูกต้อง: "${s}"`);
  }
  cell.shifts = [...list];
  cell.off = null;
  return cell;
}

/** ตั้งเป็นวันหยุด/ลา/อบรม (ล้าง shifts) */
function setCellOff(cell, off) {
  if (!OFF_VALUES.includes(off)) throw new Error(`ค่าหยุดไม่ถูกต้อง: "${off}"`);
  cell.off = off;
  cell.shifts = [];
  return cell;
}

function clearCellValue(cell) {
  cell.shifts = [];
  cell.off = null;
  return cell;
}

function cloneCell(cell) {
  return { shifts: [...cell.shifts], off: cell.off, locked: cell.locked };
}

// ---------------------------------------------------------------------------
// STAFF
// ---------------------------------------------------------------------------

/** token กะที่ตั้งเป็น "เงื่อนไขรายบุคคล" ได้ */
const ALLOW_TOKENS = ['ช', 'บ', 'ด', 'ช+บ', 'บ+ด', 'ช+ด'];

function makeStaff({ id, name, role = '', team = '', teamColor = '', allow = [] }) {
  return { id, name, role, team, teamColor, allow: [...allow] };
}

/**
 * พยาบาลคนนี้ขึ้นกะชุดนี้ได้ไหม (ตาม staff.allow)
 *   allow ว่าง = ทำได้ทุกกะ
 *   หยุด/ลา/อบรม (shifts ว่าง) = ไม่เกี่ยว คืน true เสมอ
 */
function staffAllowsShift(staff, shifts) {
  const allow = staff && staff.allow;
  if (!allow || allow.length === 0) return true;
  if (!shifts || shifts.length === 0) return true;
  return allow.includes(formatDoublePattern(shifts));
}

// ---------------------------------------------------------------------------
// ROSTER
// ---------------------------------------------------------------------------

/**
 * สร้าง roster เปล่า
 * @param {{days:number, firstWeekday:string|number, staff?:object[], year?:number|null, month?:number|null}} opts
 */
function makeRoster({ days, firstWeekday, staff = [], year = null, month = null }) {
  if (!Number.isInteger(days) || days < 1 || days > 31) {
    throw new Error(`จำนวนวันไม่ถูกต้อง: ${days}`);
  }
  const fwi = weekdayIndex(firstWeekday);
  const roster = {
    year: year ?? null,
    month: month ?? null,
    days,
    firstWeekday: WEEKDAYS[fwi],
    firstWeekdayIndex: fwi,
    staff: [],
    grid: [],
    _seq: 0, // ตัวนับ id — เดินหน้าอย่างเดียว ไม่ถอยเมื่อลบแถว (กัน id ชนกัน)
  };
  for (const s of staff) addStaff(roster, s);
  return roster;
}

function nextStaffId(roster, provided) {
  if (provided) return provided;
  // เดินจากตัวนับที่ไม่ถอยหลัง — ลบแถวแล้วเพิ่มใหม่จะไม่ได้ id ซ้ำของเดิม
  roster._seq = (roster._seq || 0) + 1;
  return `p${roster._seq}`;
}

function addStaff(roster, entry) {
  const id = nextStaffId(roster, entry && entry.id);
  roster.staff.push(makeStaff({ ...entry, id }));
  roster.grid.push(Array.from({ length: roster.days }, makeCell));
  return id;
}

function removeStaff(roster, staffIndex) {
  roster.staff.splice(staffIndex, 1);
  roster.grid.splice(staffIndex, 1);
}

function staffIndexById(roster, id) {
  return roster.staff.findIndex((s) => s.id === id);
}

function getCell(roster, staffIndex, dayIndex) {
  const row = roster.grid[staffIndex];
  return row ? row[dayIndex] : undefined;
}

function cloneRoster(roster) {
  return {
    year: roster.year,
    month: roster.month,
    days: roster.days,
    firstWeekday: roster.firstWeekday,
    firstWeekdayIndex: roster.firstWeekdayIndex,
    _seq: roster._seq || 0,
    staff: roster.staff.map((s) => ({ ...s, allow: [...(s.allow || [])] })),
    grid: roster.grid.map((row) => row.map(cloneCell)),
  };
}

// ---------------------------------------------------------------------------
// ปฏิทินภายใน roster
// ---------------------------------------------------------------------------

/** dayIndex (0-based) → weekday index 0..6 */
function weekdayIndexForDay(roster, dayIndex) {
  return (roster.firstWeekdayIndex + dayIndex) % 7;
}

function weekdayNameForDay(roster, dayIndex) {
  return WEEKDAYS[weekdayIndexForDay(roster, dayIndex)];
}

function isWeekend(roster, dayIndex) {
  return WEEKEND_INDICES.includes(weekdayIndexForDay(roster, dayIndex));
}

/** dayIndex ที่เป็นวันแรกของแต่ละสัปดาห์ (ไว้ตีเส้นหนาทุก 7 วันใน UI) */
function isWeekBoundary(roster, dayIndex) {
  return dayIndex > 0 && weekdayIndexForDay(roster, dayIndex) === roster.firstWeekdayIndex;
}

// ---------------------------------------------------------------------------
// RULES
// ---------------------------------------------------------------------------

function defaultRules() {
  return {
    // จำนวนคนต่อกะต่อวัน — เป็นช่วง { min, max } (min===max = ต้องเป๊ะ, max=null = ไม่มีเพดาน)
    activeShifts: [SHIFT.MORNING, SHIFT.AFTERNOON, SHIFT.NIGHT], // เอากะออก = ตัดจากลิสต์นี้
    target: {
      [SHIFT.MORNING]: { min: 4, max: 4 },
      [SHIFT.AFTERNOON]: { min: 3, max: 3 },
      [SHIFT.NIGHT]: { min: 2, max: 2 },
    },
    targetOverrides: [],            // { weekday?, day?, shift, min, max }
    offQuota: 6,
    offQuotaMode: 'exact',          // 'exact' | 'max'
    countLeaveInQuota: false,
    keepExcessLockedOff: true,
    // ขึ้น 2 กะ/วัน ได้ทุกแบบเมื่อจำเป็น — ไม่ล็อกว่าต้องเป็นคู่ไหน
    // (ตัดออกจากลิสต์ = ห้ามคู่นั้น; ลิสต์ว่าง = ห้ามขึ้น 2 กะ/วัน ทั้งหมด)
    allowedDoubles: ['ช+บ', 'บ+ด', 'ช+ด'],
    maxNightToMorning: 0,            // ด → เช้าวันรุ่งขึ้น: ห้ามเด็ดขาด (0 = ผิดกฎเสมอ)
    maxConsecutiveNights: 2,
    maxConsecutiveWork: 5,
    maxConsecutiveOff: 2,
    maxDoublesPerPerson: 4,
    minGapBetweenDoubles: 3,
    lockedShiftsEditable: false,
    fairnessPriority: 'totalShifts', // 'offDays' | 'totalShifts' | 'nights' | 'weekends'
    weights: { safety: 500, coverage: 1000, workload: 120, fairness: 30 },
  };
}

/**
 * ทำค่าเป้าให้เป็นช่วงมาตรฐาน { min, max }
 *   number n            -> { min:n, max:n }
 *   { min }             -> { min, max:min }
 *   { min, max:null }   -> { min, max:null }  (ไม่มีเพดาน)
 *   { min, max }        -> ตามนั้น
 */
function normalizeBand(value) {
  if (value == null) return { min: 0, max: 0 };
  if (typeof value === 'number') return { min: value, max: value };
  const min = Number.isFinite(value.min) ? value.min : 0;
  const max = value.max === null ? null : (Number.isFinite(value.max) ? value.max : min);
  return { min, max };
}

/** รวม rules ที่ผู้ใช้ให้มาทับค่าเริ่มต้น (deep เฉพาะ target/weights/overrides) */
function mergeRules(partial = {}) {
  const base = defaultRules();
  const merged = { ...base, ...partial };

  merged.activeShifts = [...(partial.activeShifts || base.activeShifts)];

  const rawTarget = { ...base.target, ...(partial.target || {}) };
  merged.target = {};
  for (const s of SHIFT_VALUES) merged.target[s] = normalizeBand(rawTarget[s]);

  merged.targetOverrides = (partial.targetOverrides || base.targetOverrides).map((o) => {
    // รองรับรูปแบบเก่า { ..., target: n }
    const band = 'target' in o ? normalizeBand(o.target) : normalizeBand({ min: o.min, max: o.max });
    const out = { shift: o.shift, min: band.min, max: band.max };
    if (o.weekday != null) out.weekday = o.weekday;
    if (o.day != null) out.day = Number(o.day);
    return out;
  });

  merged.weights = { ...base.weights, ...(partial.weights || {}) };
  merged.allowedDoubles = [...(partial.allowedDoubles || base.allowedDoubles)];
  return merged;
}

function isShiftActive(rules, shift) {
  return rules.activeShifts.includes(shift);
}

/** parse 'ช+บ' → ['ช','บ'] (เรียงตาม ROTATION_ORDER) */
function parseDoublePattern(pattern) {
  const parts = String(pattern).split('+').map((p) => p.trim());
  for (const p of parts) {
    if (!SHIFT_VALUES.includes(p)) throw new Error(`รูปแบบกะ 2 กะ/วัน ไม่ถูกต้อง: "${pattern}"`);
  }
  return [...parts].sort((a, b) => ROTATION_ORDER.indexOf(a) - ROTATION_ORDER.indexOf(b));
}

/** ['ช','บ'] → 'ช+บ' (เรียงตาม ROTATION_ORDER) */
function formatDoublePattern(shifts) {
  return [...shifts].sort((a, b) => ROTATION_ORDER.indexOf(a) - ROTATION_ORDER.indexOf(b)).join('+');
}

function isDoubleAllowed(rules, shifts) {
  if (shifts.length < 2) return true;
  const key = formatDoublePattern(shifts);
  return rules.allowedDoubles.some((p) => formatDoublePattern(parseDoublePattern(p)) === key);
}

/**
 * ช่วงจำนวนคนของกะหนึ่งในวันหนึ่ง โดยคิด targetOverrides
 * ลำดับ: ค่าฐาน → override ตามวันในสัปดาห์ → override ตามเลขวันที่ (เลขวันที่ชนะ)
 * กะที่ปิด (ไม่อยู่ใน activeShifts) → { min:0, max:0 }
 * @returns {{min:number, max:number|null}}
 */
function bandForDay(roster, rules, dayIndex, shift) {
  if (!isShiftActive(rules, shift)) return { min: 0, max: 0 };
  let band = { ...rules.target[shift] };
  const day1 = dayIndex + 1;

  for (const ov of rules.targetOverrides) {
    if (ov.shift !== shift) continue;
    if (ov.weekday != null && weekdayIndex(ov.weekday) === weekdayIndexForDay(roster, dayIndex)) {
      band = { min: ov.min, max: ov.max };
    }
  }
  for (const ov of rules.targetOverrides) {
    if (ov.shift !== shift) continue;
    if (ov.day != null && Number(ov.day) === day1) {
      band = { min: ov.min, max: ov.max };
    }
  }
  return band;
}

/** เป้าขั้นต่ำของกะในวันนั้น (ใช้บ่อยใน analyze) */
function minStaffForDay(roster, rules, dayIndex, shift) {
  return bandForDay(roster, rules, dayIndex, shift).min;
}

/** ผลรวมเป้าขั้นต่ำทุกกะทั้งเดือน = slotsNeeded */
function totalSlotsNeeded(roster, rules) {
  let total = 0;
  for (let d = 0; d < roster.days; d++) {
    for (const s of rules.activeShifts) total += bandForDay(roster, rules, d, s).min;
  }
  return total;
}


// ============================================================================
// io.js — อ่าน/เขียนไฟล์บันทึกงาน
//
// รูปแบบไฟล์: คีย์เป็น "เลขวันที่" เสมอ (1-based) — ห้ามลิสต์เรียงตามตำแหน่ง
//
//   {
//     "days": 30,
//     "firstWeekday": "อังคาร",
//     "rules": { ... },                 // ไม่บังคับ (ไม่มี = ใช้ค่าเริ่มต้น)
//     "staff": [
//       { "name": "พยาบาล A",
//         "locked": { "1":"บ", "9":"R", "19":"ช+บ" },   // ตั้งค่า + ล็อก
//         "filled": { "3":"ด" } }                        // ตั้งค่า ไม่ล็อก (ไม่บังคับ)
//     ]
//   }
//
// token ของช่อง:  "ช" | "บ" | "ด" | "ช+บ" (ขึ้น 2 กะ/วัน) | "R" | "O" | "V" | "T"
// วันที่ไม่ระบุ = ช่องว่าง
// ============================================================================



// ---------------------------------------------------------------------------
// TOKEN <-> CELL
// ---------------------------------------------------------------------------

/** "ช" / "ช+บ" / "R" → { shifts, off }  (โยน error ถ้า token เพี้ยน) */
function parseCellToken(token) {
  const t = String(token).trim();
  if (t === '') throw new Error('token ว่าง');

  if (OFF_VALUES.includes(t)) {
    return { shifts: [], off: t };
  }
  if (t.includes('+')) {
    return { shifts: parseDoublePattern(t), off: null };
  }
  if (SHIFT_VALUES.includes(t)) {
    return { shifts: [t], off: null };
  }
  // 2 กะ/วัน แบบเขียนติดกัน เช่น "ชบ" (แบบในเอกสารโรงพยาบาล)
  if ([...t].length === 2 && [...t].every((ch) => SHIFT_VALUES.includes(ch))) {
    return { shifts: parseDoublePattern([...t].join('+')), off: null };
  }
  throw new Error(`token ไม่รู้จัก: "${token}" (ต้องเป็น ช/บ/ด/ช+บ/R/O/V/T)`);
}

/** cell → token string หรือ null ถ้าช่องว่าง */
function cellToToken(cell) {
  if (cell.shifts.length >= 2) return formatDoublePattern(cell.shifts);
  if (cell.shifts.length === 1) return cell.shifts[0];
  if (cell.off !== null) return cell.off;
  return null;
}

// ---------------------------------------------------------------------------
// PARSE
// ---------------------------------------------------------------------------

/**
 * อ่าน doc (object หรือ JSON string) → { roster, rules, warnings }
 * @param {object|string} input
 * @param {{strict?:boolean}} [opts]  strict=true จะโยน error แทนการเก็บ warning
 */
function parseRoster(input, opts = {}) {
  const strict = !!opts.strict;
  const doc = typeof input === 'string' ? JSON.parse(input) : input;
  const warnings = [];

  const fail = (msg) => {
    if (strict) throw new Error(msg);
    warnings.push(msg);
  };

  if (!doc || typeof doc !== 'object') throw new Error('ไฟล์บันทึกไม่ใช่ object');
  if (!Number.isInteger(doc.days)) throw new Error('ไฟล์บันทึกต้องมี "days" เป็นจำนวนเต็ม');
  if (doc.firstWeekday == null) throw new Error('ไฟล์บันทึกต้องมี "firstWeekday"');

  const rules = mergeRules(doc.rules || {});
  const roster = makeRoster({
    days: doc.days,
    firstWeekday: doc.firstWeekday,
    year: doc.year ?? null,
    month: doc.month ?? null,
  });

  const staffList = Array.isArray(doc.staff) ? doc.staff : [];
  staffList.forEach((entry, si) => {
    if (!entry || typeof entry !== 'object') {
      fail(`staff[${si}] ไม่ใช่ object — ข้าม`);
      return;
    }
    const label = entry.name || `staff[${si}]`;
    const staffIndex = roster.staff.length;
    addStaff(roster, {
      id: entry.id,
      name: entry.name || `พนักงาน ${si + 1}`,
      role: entry.role || '',
      team: entry.team || '',
      teamColor: entry.teamColor || '',
      allow: (Array.isArray(entry.allow) ? entry.allow : []).filter((t) => ALLOW_TOKENS.includes(t)),
    });

    applyDayDict(roster, staffIndex, entry.locked, true, label, doc.days, fail);
    applyDayDict(roster, staffIndex, entry.filled, false, label, doc.days, fail);
  });

  return { roster, rules, warnings };
}

function applyDayDict(roster, staffIndex, dict, locked, label, days, fail) {
  if (dict == null) return;
  if (typeof dict !== 'object') {
    fail(`${label}: ฟิลด์ ${locked ? 'locked' : 'filled'} ไม่ใช่ object — ข้าม`);
    return;
  }
  for (const [dayKey, token] of Object.entries(dict)) {
    const dayNum = Number(dayKey);
    if (!Number.isInteger(dayNum) || dayNum < 1 || dayNum > days) {
      fail(`${label}: เลขวันที่ "${dayKey}" นอกช่วง 1..${days} — ข้าม`);
      continue;
    }
    const dayIndex = dayNum - 1;
    const cell = roster.grid[staffIndex][dayIndex];

    if (cell.shifts.length > 0 || cell.off !== null) {
      // ช่องนี้ถูกกำหนดไปแล้ว (locked มาก่อน filled) — locked ชนะ
      if (locked) {
        fail(`${label}: วันที่ ${dayNum} ซ้ำใน locked — ใช้ค่าหลัง`);
      } else {
        fail(`${label}: วันที่ ${dayNum} อยู่ทั้ง locked และ filled — คง locked ไว้`);
        continue;
      }
    }

    let parsed;
    try {
      parsed = parseCellToken(token);
    } catch (err) {
      fail(`${label}: วันที่ ${dayNum} — ${err.message}`);
      continue;
    }

    if (parsed.off !== null) setCellOff(cell, parsed.off);
    else setCellShifts(cell, parsed.shifts);
    cell.locked = locked;
  }
}

// ---------------------------------------------------------------------------
// SERIALIZE
// ---------------------------------------------------------------------------

/**
 * roster (+ rules) → plain object พร้อม JSON.stringify
 * เขียน `locked` เสมอ, `filled` เฉพาะเมื่อมีช่องที่เติมแล้วไม่ล็อก
 */
function serializeRoster(roster, rules = null) {
  const doc = {
    days: roster.days,
    firstWeekday: roster.firstWeekday,
  };
  if (roster.year != null) doc.year = roster.year;
  if (roster.month != null) doc.month = roster.month;
  if (rules) doc.rules = rules;

  doc.staff = roster.staff.map((s, si) => {
    const entry = { name: s.name };
    if (s.role) entry.role = s.role;
    if (s.team) entry.team = s.team;
    if (s.teamColor) entry.teamColor = s.teamColor;
    if (s.allow && s.allow.length) entry.allow = [...s.allow];

    const locked = {};
    const filled = {};
    roster.grid[si].forEach((cell, di) => {
      const token = cellToToken(cell);
      if (token == null) return;
      (cell.locked ? locked : filled)[String(di + 1)] = token;
    });
    entry.locked = locked;
    if (Object.keys(filled).length > 0) entry.filled = filled;
    return entry;
  });

  return doc;
}

/** helper: serialize แล้ว stringify สวย ๆ สำหรับดาวน์โหลด */
function toJSONString(roster, rules = null) {
  return JSON.stringify(serializeRoster(roster, rules), null, 2);
}


// ============================================================================
// analyze.js — วิเคราะห์ตารางเวร
//
// JS บริสุทธิ์ ห้ามแตะ DOM (ต้อง import ด้วย node ได้ตรง ๆ)
//
// รับ roster (จาก model.js) + rules (ผ่าน mergeRules มาแล้ว) แล้วคืน object เดียว
// ที่ตอบ 3 คำถาม:
//   1. feasibility — ตารางนี้ "มีทางจัดให้ครบ" ไหม (slot ที่ต้องการ vs วันว่างที่มี)
//   2. coverage    — แต่ละกะแต่ละวันตอนนี้คนพอ/ขาด/เกิน เท่าไร
//   3. violations  — กฎที่ "ถูกละเมิดแล้ว" จากช่องที่ล็อก/เติมไว้
//
// ทุกค่า `day` ในผลลัพธ์เป็นเลขวันที่ 1-based (ตรงกับไฟล์บันทึกและหน้าจอ)
//
// หมายเหตุสำคัญ: ดต่อเช้า (night→morning) นับ `ด` ที่อยู่ในกะ 2 กะ/วัน (เช่น บ+ด) ด้วย —
//   ถ้าวัน N มี ด และวัน N+1 มี ช (กะเดียวหรือรวมอยู่ใน ช+บ / ช+ด) = ผิดกฎ
// ============================================================================



// ---------------------------------------------------------------------------
// helper ระดับช่อง
// ---------------------------------------------------------------------------

/** ช่องนี้มีกะ `shift` ไหม (นับกะที่รวมอยู่ใน ช+บ / บ+ด / ช+ด ด้วย) */
function hasShift(cell, shift) {
  return cell.shifts.includes(shift);
}

/** จำนวน slot ที่ช่องนี้กิน: กะเดียว = 1, 2 กะ/วัน = 2, หยุด/ว่าง = 0 */
function slotsInCell(cell) {
  return cell.shifts.length;
}

/** วันนี้ "ไม่พร้อมทำงาน" (หยุด/ลา/อบรม) */
function isAway(cell) {
  return isRest(cell) || isLeave(cell) || isTraining(cell);
}

// ---------------------------------------------------------------------------
// analyze
// ---------------------------------------------------------------------------

/**
 * @param {object} roster  — จาก makeRoster/parseRoster
 * @param {object} rules   — จาก mergeRules
 * @param {{manyOffThreshold?:number}} [opts]
 */
function analyze(roster, rules, opts = {}) {
  const manyOffThreshold = opts.manyOffThreshold ?? 3;
  const D = roster.days;
  const N = roster.staff.length;
  const activeShifts = rules.activeShifts.filter((s) => isShiftActive(rules, s));

  // ---- slot ที่ทั้งเดือนต้องการ (ต่ำสุด / เพดานรวม) ----
  let slotsNeeded = 0;
  let slotsMax = 0;
  let slotsMaxUnbounded = false;
  for (let d = 0; d < D; d++) {
    for (const s of activeShifts) {
      const band = bandForDay(roster, rules, d, s);
      slotsNeeded += band.min;
      if (band.max === null) slotsMaxUnbounded = true;
      else slotsMax += band.max;
    }
  }

  // ---- เดินกริดทีละคน: สถิติ + run-length ----
  let assignedSlots = 0;
  let emptyDays = 0;
  let restDays = 0;
  let leaveDays = 0;
  let trainingDays = 0;

  const perPerson = roster.staff.map((s) => ({
    staffId: s.id,
    name: s.name,
    team: s.team || '',
    work: 0,        // จำนวน "วันที่ขึ้นเวร" (2 กะ/วัน นับ 1 วัน)
    byShift: { [SHIFT.MORNING]: 0, [SHIFT.AFTERNOON]: 0, [SHIFT.NIGHT]: 0 }, // นับกะ (รวมที่อยู่ใน 2 กะ/วัน)
    doubles: 0,
    nights: 0,
    weekends: 0,    // วันหยุดสุดสัปดาห์ที่ต้องขึ้นเวร
    rest: 0,        // R + O
    leave: 0,       // V
    training: 0,    // T
    empty: 0,
    offCounted: 0,  // วันที่นับเข้าโควตาหยุด
    maxConsecutiveWork: 0,
    maxConsecutiveNights: 0,
    maxConsecutiveOff: 0,
  }));

  for (let i = 0; i < N; i++) {
    const row = roster.grid[i];
    const p = perPerson[i];
    let runWork = 0;
    let runNight = 0;
    let runOff = 0;

    for (let d = 0; d < D; d++) {
      const cell = row[d];
      const n = slotsInCell(cell);
      assignedSlots += n;

      if (n > 0) {
        p.work += 1;
        if (n >= 2) p.doubles += 1;
        for (const sh of cell.shifts) p.byShift[sh] += 1;
        if (hasShift(cell, SHIFT.NIGHT)) p.nights += 1;
        if (isWeekend(roster, d)) p.weekends += 1;
        runWork += 1;
        if (runWork > p.maxConsecutiveWork) p.maxConsecutiveWork = runWork;
      } else {
        runWork = 0;
      }

      if (hasShift(cell, SHIFT.NIGHT)) {
        runNight += 1;
        if (runNight > p.maxConsecutiveNights) p.maxConsecutiveNights = runNight;
      } else {
        runNight = 0;
      }

      if (isRest(cell)) {
        p.rest += 1;
        restDays += 1;
        runOff += 1;
        if (runOff > p.maxConsecutiveOff) p.maxConsecutiveOff = runOff;
      } else {
        runOff = 0;
      }

      if (isLeave(cell)) { p.leave += 1; leaveDays += 1; }
      if (isTraining(cell)) { p.training += 1; trainingDays += 1; }
      if (isEmpty(cell)) { p.empty += 1; emptyDays += 1; }
    }

    p.offCounted = p.rest + (rules.countLeaveInQuota ? p.leave : 0);
  }

  // ---- coverage รายวัน/รายกะ + วันที่คนหยุดเยอะ ----
  const coverage = [];
  const gaps = [];
  const daysManyOff = [];

  for (let d = 0; d < D; d++) {
    let offToday = 0;
    for (let i = 0; i < N; i++) {
      const cell = roster.grid[i][d];
      if (isRest(cell) || isLeave(cell)) offToday += 1;
    }
    if (offToday >= manyOffThreshold) {
      daysManyOff.push({ day: d + 1, off: offToday, available: N - offToday });
    }

    for (const s of activeShifts) {
      const band = bandForDay(roster, rules, d, s);
      let assigned = 0;
      for (let i = 0; i < N; i++) {
        if (hasShift(roster.grid[i][d], s)) assigned += 1;
      }
      let status = 'ok';
      if (assigned < band.min) status = 'under';
      else if (band.max !== null && assigned > band.max) status = 'over';

      const entry = { day: d + 1, shift: s, assigned, min: band.min, max: band.max, status };
      coverage.push(entry);
      if (status !== 'ok') gaps.push(entry);
    }
  }

  // ---- violations ----
  const violations = [];
  const add = (v) => violations.push(v);

  for (let i = 0; i < N; i++) {
    const row = roster.grid[i];
    const p = perPerson[i];
    const who = { staffId: roster.staff[i].id, name: roster.staff[i].name };

    // ด→ช — นับ ด/ช ที่รวมอยู่ในกะ 2 กะ/วันด้วย
    const n2m = [];
    for (let d = 0; d < D - 1; d++) {
      if (hasShift(row[d], SHIFT.NIGHT) && hasShift(row[d + 1], SHIFT.MORNING)) n2m.push(d);
    }
    if (n2m.length > (rules.maxNightToMorning || 0)) {
      for (const d of n2m) {
        add({
          type: 'nightToMorning', severity: 'error', ...who, day: d + 1,
          message: `${who.name}: ด (วันที่ ${d + 1}) → ช (วันที่ ${d + 2})`,
        });
      }
    }

    // กะ 2 กะ/วัน ที่ไม่อยู่ในลิสต์ allowedDoubles
    for (let d = 0; d < D; d++) {
      const cell = row[d];
      if (cell.shifts.length >= 2 && !isDoubleAllowed(rules, cell.shifts)) {
        const pattern = formatDoublePattern(cell.shifts);
        add({
          type: 'doubleNotAllowed', severity: 'error', ...who, day: d + 1, pattern,
          message: `${who.name}: ${pattern} ไม่อนุญาต (วันที่ ${d + 1})`,
        });
      }
    }

    // กะที่ไม่ตรงเงื่อนไขรายบุคคล (staff.allow)
    for (let d = 0; d < D; d++) {
      const cell = row[d];
      if (cell.shifts.length > 0 && !staffAllowsShift(roster.staff[i], cell.shifts)) {
        const pattern = formatDoublePattern(cell.shifts);
        add({
          type: 'shiftNotAllowed', severity: 'error', ...who, day: d + 1, pattern,
          message: `${who.name}: ${pattern} (วันที่ ${d + 1}) ไม่ใช่กะที่ทำได้ (จำกัด: ${roster.staff[i].allow.join(' ')})`,
        });
      }
    }

    // ด ติดกันเกินเพดาน
    if (p.maxConsecutiveNights > rules.maxConsecutiveNights) {
      add({
        type: 'consecutiveNights', severity: 'error', ...who,
        count: p.maxConsecutiveNights, limit: rules.maxConsecutiveNights,
        message: `${who.name}: ด ติดกัน ${p.maxConsecutiveNights} วัน (เพดาน ${rules.maxConsecutiveNights})`,
      });
    }

    // ช/บ/ด ติดกันเกินเพดาน
    if (p.maxConsecutiveWork > rules.maxConsecutiveWork) {
      add({
        type: 'consecutiveWork', severity: 'warn', ...who,
        count: p.maxConsecutiveWork, limit: rules.maxConsecutiveWork,
        message: `${who.name}: ช/บ/ด ติดกัน ${p.maxConsecutiveWork} วัน (เพดาน ${rules.maxConsecutiveWork})`,
      });
    }

    // R/O ติดกันเกินเพดาน
    if (p.maxConsecutiveOff > rules.maxConsecutiveOff) {
      add({
        type: 'consecutiveOff', severity: 'warn', ...who,
        count: p.maxConsecutiveOff, limit: rules.maxConsecutiveOff,
        message: `${who.name}: R/O ติดกัน ${p.maxConsecutiveOff} วัน (เพดาน ${rules.maxConsecutiveOff})`,
      });
    }

    // ขึ้น 2 กะ/วัน เยอะเกินเพดานต่อคน
    if (p.doubles > rules.maxDoublesPerPerson) {
      add({
        type: 'tooManyDoubles', severity: 'warn', ...who,
        count: p.doubles, limit: rules.maxDoublesPerPerson,
        message: `${who.name}: ขึ้น 2 กะ/วัน ${p.doubles} ครั้ง (เพดาน ${rules.maxDoublesPerPerson})`,
      });
    }

    // ระยะห่างระหว่างวันที่ขึ้น 2 กะ/วัน สองครั้งติดกัน
    const dblDays = [];
    for (let d = 0; d < D; d++) if (row[d].shifts.length >= 2) dblDays.push(d);
    for (let k = 1; k < dblDays.length; k++) {
      const gap = dblDays[k] - dblDays[k - 1];
      if (gap < rules.minGapBetweenDoubles) {
        add({
          type: 'doubleGapTooSmall', severity: 'warn', ...who,
          day: dblDays[k - 1] + 1, nextDay: dblDays[k] + 1, gap, limit: rules.minGapBetweenDoubles,
          message: `${who.name}: ขึ้น 2 กะ/วัน วันที่ ${dblDays[k - 1] + 1} กับ ${dblDays[k] + 1} ห่างกัน ${gap} วัน (ต้อง ≥ ${rules.minGapBetweenDoubles})`,
        });
      }
    }

    // วันหยุด O+R เทียบโควตา — ยกเว้นคนที่ "ล็อก" วันหยุดไว้เกินโควตาอยู่แล้ว
    {
      let lockedRest = 0;
      let emptyCells = 0;
      for (let d = 0; d < D; d++) {
        const cell = row[d];
        if (cell.locked && isRest(cell)) lockedRest += 1;
        if (isEmpty(cell)) emptyCells += 1;
      }
      const total = p.offCounted;
      const quota = rules.offQuota;
      const kinds = rules.countLeaveInQuota ? 'R+O+V' : 'R+O';
      if (lockedRest > quota) {
        add({
          type: 'restLockedOver', severity: 'warn', ...who,
          count: lockedRest, quota,
          message: `${who.name}: ล็อกวันหยุดไว้ ${lockedRest} วัน (เกินโควตา ${quota}) — ยกเว้นให้`,
        });
      } else if (total > quota) {
        add({
          type: 'restOver', severity: 'error', ...who,
          count: total, quota,
          message: `${who.name}: ${kinds} ${total} วัน เกินโควตา ${quota}`,
        });
      } else if (rules.offQuotaMode === 'exact' && total < quota && emptyCells === 0) {
        add({
          type: 'restShort', severity: 'error', ...who,
          count: total, quota,
          message: `${who.name}: ${kinds} ${total} วัน ขาดโควตา ${quota}`,
        });
      }
    }
  }

  // coverage ที่ "เกินเพดาน" ตอนนี้ = คนถูกล็อกไว้เกิน → ละเมิด
  for (const g of gaps) {
    if (g.status === 'over') {
      add({
        type: 'coverageOver', severity: 'error',
        day: g.day, shift: g.shift, count: g.assigned, max: g.max,
        message: `วันที่ ${g.day} ${g.shift}: ${g.assigned} คน (เพดาน ${g.max})`,
      });
    }
  }

  // ---- feasibility ----
  const doublesExisting = perPerson.reduce((a, p) => a + p.doubles, 0);
  const workDaysAvailable = N * D - restDays - leaveDays - trainingDays;
  // เติมช่องว่างทุกช่องเป็นกะเดียว จะได้ slot รวมเท่านี้
  const capacitySingles = assignedSlots + emptyDays;
  const doublesNeeded = Math.max(0, slotsNeeded - capacitySingles);
  const doubleCapacity = perPerson.reduce(
    (a, p) => a + Math.max(0, rules.maxDoublesPerPerson - p.doubles), 0,
  );

  const reasons = [];
  if (N === 0) reasons.push('ไม่มีพนักงาน');
  if (doublesNeeded > doubleCapacity) {
    reasons.push(`ต้องเพิ่มวันขึ้น 2 กะ/วัน อีก ${doublesNeeded} ครั้ง แต่เพดานรวมรับได้อีก ${doubleCapacity}`);
  }
  if (!slotsMaxUnbounded && assignedSlots > slotsMax) {
    reasons.push(`กะที่ล็อก/เติมไว้ (${assignedSlots}) เกินเพดานรวม (${slotsMax})`);
  }

  const feasibility = {
    slotsNeeded,
    slotsMax: slotsMaxUnbounded ? null : slotsMax,
    assignedSlots,
    workDaysAvailable,
    emptyDays,
    restDays,
    leaveDays,
    trainingDays,
    doublesExisting,
    doublesNeeded,
    doubleCapacity,
    avgDoublesPerPerson: N ? Number((doublesNeeded / N).toFixed(2)) : 0,
    feasible: reasons.length === 0,
    reasons,
  };

  return {
    days: D,
    staffCount: N,
    activeShifts,
    feasibility,
    coverage,
    gaps,
    daysManyOff,
    violations,
    perPerson,
    summary: {
      errors: violations.filter((v) => v.severity === 'error').length,
      warnings: violations.filter((v) => v.severity === 'warn').length,
      under: gaps.filter((g) => g.status === 'under').length,
      over: gaps.filter((g) => g.status === 'over').length,
    },
  };
}


// ============================================================================
// solver.js — จัดตารางเวรอัตโนมัติ (เติมช่องว่างให้ครอบคลุม)
//
// JS บริสุทธิ์ ห้ามแตะ DOM
//
// วิธี:
//   1) constructive — ไล่เติมกะให้ถึงขั้นต่ำของแต่ละกะแต่ละวัน (ด ก่อน แล้ว ช, บ)
//   2) polish — สุ่มปรับช่องที่ไม่ล็อก รับเฉพาะที่คะแนนดีขึ้น (hill-climb)
//   3) fillRest / balanceRest — เติมช่องว่างที่เหลือเป็น O แล้วเกลี่ยให้ตรงโควตา
//   4) restViaDoubles (เฉพาะโหมด exact) — คนที่หยุดไม่ถึงโควตา ยกกะเดียวไปเป็น
//      กะที่ 2 ของเพื่อนร่วมกะ เพื่อปิดช่องว่างวันหยุดโดย coverage คงเดิม
//
// กติกาที่ "ห้ามละเมิดเด็ดขาด" ระหว่างจัด:
//   - ไม่แตะช่องที่ล็อก / ลา (V) / อบรม (T)
//   - ด (วันที่ N) → ช (วันที่ N+1) ห้าม  (นับ ด/ช ที่รวมอยู่ในกะ 2 กะ/วันด้วย)
//   - กะ 2 กะ/วัน ต้องอยู่ใน allowedDoubles
//   - ห้ามเกินเพดานคนต่อกะ (band.max), maxConsecutiveNights, maxConsecutiveWork,
//     maxDoublesPerPerson, minGapBetweenDoubles
// ============================================================================



// ลำดับความสำคัญตอนเติม: ด ยากสุด → ช → บ
const FILL_ORDER = [SHIFT.NIGHT, SHIFT.MORNING, SHIFT.AFTERNOON];

// ---------------------------------------------------------------------------
// RNG (seeded, ผลซ้ำได้)
// ---------------------------------------------------------------------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (rnd, arr) => arr[(rnd() * arr.length) | 0];

// ---------------------------------------------------------------------------
// helper ระดับช่อง (raw — ไม่ validate, เร็ว)
// ---------------------------------------------------------------------------
function sortShifts(arr) {
  return [...arr].sort((x, y) => ROTATION_ORDER.indexOf(x) - ROTATION_ORDER.indexOf(y));
}
function setShifts(cell, arr) { cell.shifts = sortShifts(arr); cell.off = null; }
function setOff(cell, off) { cell.shifts = []; cell.off = off; }
function clearCell(cell) { cell.shifts = []; cell.off = null; }
function snap(cell) { return { shifts: [...cell.shifts], off: cell.off, locked: cell.locked }; }
function restore(cell, s) { cell.shifts = [...s.shifts]; cell.off = s.off; cell.locked = s.locked; }

function isFixed(cell) {
  return cell.locked || cell.off === OFF.LEAVE || cell.off === OFF.TRAINING;
}
function assignedCount(roster, d, shift) {
  let n = 0;
  for (const row of roster.grid) if (row[d].shifts.includes(shift)) n++;
  return n;
}
function personDoubles(row, exceptDay) {
  const days = [];
  for (let k = 0; k < row.length; k++) if (k !== exceptDay && row[k].shifts.length >= 2) days.push(k);
  return days;
}

// ---------------------------------------------------------------------------
// ตรวจกติกา "ห้ามเด็ดขาด" ของช่อง (i,d) หลังใส่ค่าแล้ว
// ---------------------------------------------------------------------------
function cellHardOK(roster, rules, i, d) {
  const row = roster.grid[i];
  const cell = row[d];
  if (cell.shifts.length === 0) return true;
  const last = row.length - 1;

  // เงื่อนไขรายบุคคล
  if (!staffAllowsShift(roster.staff[i], cell.shifts)) return false;

  if (cell.shifts.length >= 2) {
    if (!isDoubleAllowed(rules, cell.shifts)) return false;
    const others = personDoubles(row, d);
    if (others.length + 1 > rules.maxDoublesPerPerson) return false;
    for (const k of others) if (Math.abs(k - d) < rules.minGapBetweenDoubles) return false;
  }

  // ด→ช
  if (cell.shifts.includes(SHIFT.MORNING) && d > 0 && row[d - 1].shifts.includes(SHIFT.NIGHT)) return false;
  if (cell.shifts.includes(SHIFT.NIGHT) && d < last && row[d + 1].shifts.includes(SHIFT.MORNING)) return false;

  // ด ติดกัน
  if (cell.shifts.includes(SHIFT.NIGHT)) {
    let run = 1;
    for (let k = d - 1; k >= 0 && row[k].shifts.includes(SHIFT.NIGHT); k--) run++;
    for (let k = d + 1; k <= last && row[k].shifts.includes(SHIFT.NIGHT); k++) run++;
    if (run > rules.maxConsecutiveNights) return false;
  }

  // ช/บ/ด ติดกัน
  {
    let run = 1;
    for (let k = d - 1; k >= 0 && row[k].shifts.length > 0; k--) run++;
    for (let k = d + 1; k <= last && row[k].shifts.length > 0; k++) run++;
    if (run > rules.maxConsecutiveWork) return false;
  }
  return true;
}

function coverageMaxOK(roster, rules, d) {
  for (const s of rules.activeShifts) {
    if (!isShiftActive(rules, s)) continue;
    const band = bandForDay(roster, rules, d, s);
    if (band.max != null && assignedCount(roster, d, s) > band.max) return false;
  }
  return true;
}

/** ลองใส่ shifts ที่ช่อง (i,d) — คืน true ถ้าผ่านกติกาห้าม (คงค่าไว้), ไม่ผ่าน = คืนค่าเดิม */
function tryPut(roster, rules, i, d, shifts) {
  const cell = roster.grid[i][d];
  if (isFixed(cell)) return false;
  const sv = snap(cell);
  if (shifts.length === 0) setOff(cell, OFF.FILLED);
  else setShifts(cell, shifts);
  cell.locked = false;
  const last = roster.days - 1;
  const ok = cellHardOK(roster, rules, i, d)
    && coverageMaxOK(roster, rules, d)
    && (d <= 0 || cellHardOK(roster, rules, i, d - 1))
    && (d >= last || cellHardOK(roster, rules, i, d + 1));
  if (!ok) { restore(cell, sv); return false; }
  return true;
}

// ---------------------------------------------------------------------------
// คะแนน (ยิ่งน้อยยิ่งดี)
// ---------------------------------------------------------------------------
function spread(arr) {
  if (arr.length < 2) return 0;
  return Math.max(...arr) - Math.min(...arr);
}

function cost(roster, rules) {
  const D = roster.days;
  const N = roster.staff.length;
  const W = rules.weights;
  const active = rules.activeShifts.filter((s) => isShiftActive(rules, s));

  let coverage = 0;
  let safety = 0;
  let workload = 0;

  for (let d = 0; d < D; d++) {
    for (const s of active) {
      const band = bandForDay(roster, rules, d, s);
      const a = assignedCount(roster, d, s);
      if (a < band.min) coverage += band.min - a;
      if (band.max != null && a > band.max) coverage += (a - band.max) * 2;
    }
  }

  const loads = [];
  const nights = [];
  const weekends = [];
  let totalDoubles = 0;

  for (let i = 0; i < N; i++) {
    const row = roster.grid[i];
    let w = 0; let n = 0; let we = 0; let off = 0; let leave = 0; let db = 0;
    let runW = 0; let runN = 0; let runO = 0;

    for (let d = 0; d < D; d++) {
      const cell = row[d];
      const k = cell.shifts.length;
      if (k > 0) {
        w += k;
        if (k >= 2) db++;
        if (cell.shifts.includes(SHIFT.NIGHT)) n++;
        if (isWeekend(roster, d)) we++;
        runW++;
        if (runW > rules.maxConsecutiveWork) safety += runW - rules.maxConsecutiveWork;
        if (cell.shifts.includes(SHIFT.NIGHT)) {
          runN++;
          if (runN > rules.maxConsecutiveNights) safety += runN - rules.maxConsecutiveNights;
        } else runN = 0;
        runO = 0;
        if (k >= 2 && !isDoubleAllowed(rules, cell.shifts)) safety += 5;
        if (cell.shifts.includes(SHIFT.MORNING) && d > 0 && row[d - 1].shifts.includes(SHIFT.NIGHT)) safety += 10;
      } else {
        runW = 0; runN = 0;
        if (cell.off === OFF.LOCKED || cell.off === OFF.FILLED) {
          off++; runO++;
          if (runO > rules.maxConsecutiveOff) workload += runO - rules.maxConsecutiveOff;
        } else {
          runO = 0;
          if (cell.off === OFF.LEAVE) leave++;
        }
      }
    }

    if (db > rules.maxDoublesPerPerson) workload += (db - rules.maxDoublesPerPerson) * 3;
    const quota = off + (rules.countLeaveInQuota ? leave : 0);
    if (rules.offQuotaMode === 'exact') workload += Math.abs(quota - rules.offQuota);
    else workload += Math.max(0, quota - rules.offQuota);

    loads.push(w);
    nights.push(n);
    weekends.push(we);
    totalDoubles += db;
  }

  const fairness = spread(loads) + spread(nights) * 0.5 + spread(weekends) * 0.5;
  const total = safety * W.safety
    + coverage * W.coverage
    + workload * W.workload
    + fairness * W.fairness
    + totalDoubles * (W.workload * 0.4);

  return { total, coverage, safety, workload, fairness, doubles: totalDoubles };
}

// ---------------------------------------------------------------------------
// 1) constructive
// ---------------------------------------------------------------------------
function loadOf(row) {
  let n = 0;
  for (const c of row) n += c.shifts.length;
  return n;
}

function constructive(R, rules, rnd) {
  const D = R.days;
  const N = R.staff.length;
  const active = FILL_ORDER.filter((s) => isShiftActive(rules, s));

  for (let pass = 0; pass < 2; pass++) {
    for (let d = 0; d < D; d++) {
      for (const s of active) {
        const band = bandForDay(R, rules, d, s);
        let guard = 0;
        while (assignedCount(R, d, s) < band.min && guard++ < N * 2) {
          // ผู้สมัคร: ช่องว่าง/O ก่อน แล้วค่อยเป็นกะ 2 กะ/วัน
          const singles = [];
          const doubles = [];
          for (let i = 0; i < N; i++) {
            const cell = R.grid[i][d];
            if (isFixed(cell) || cell.shifts.includes(s) || cell.shifts.length >= 2) continue;
            if (cell.shifts.length === 0) singles.push(i);
            else doubles.push(i);
          }
          const orderBy = (list) => list
            .map((i) => ({ i, k: loadOf(R.grid[i]) + rnd() * 0.5 }))
            .sort((a, b) => a.k - b.k)
            .map((x) => x.i);

          let placed = false;
          for (const i of orderBy(singles)) {
            if (tryPut(R, rules, i, d, [s])) { placed = true; break; }
          }
          if (!placed) {
            for (const i of orderBy(doubles)) {
              const cur = R.grid[i][d].shifts[0];
              if (tryPut(R, rules, i, d, [cur, s])) { placed = true; break; }
            }
          }
          if (!placed) break;
        }
      }
    }
  }
}

// ---------------------------------------------------------------------------
// 2) polish (hill-climb)
// ---------------------------------------------------------------------------
function polish(R, rules, rnd, iterations) {
  const D = R.days;
  const N = R.staff.length;
  const active = rules.activeShifts.filter((s) => isShiftActive(rules, s));
  let curCost = cost(R, rules).total;
  let best = cloneRoster(R);
  let bestCost = curCost;

  for (let it = 0; it < iterations; it++) {
    // เป้าหมาย: 60% เล็งไปที่กะที่ยังขาด
    let i; let d;
    const sv = [];
    const touched = [];

    if (rnd() < 0.6) {
      const shorts = [];
      for (let dd = 0; dd < D; dd++) {
        for (const s of active) {
          const b = bandForDay(R, rules, dd, s);
          if (assignedCount(R, dd, s) < b.min) shorts.push([dd, s]);
        }
      }
      if (!shorts.length) continue;
      const [dd, s] = pick(rnd, shorts);
      d = dd;
      const opts = [];
      for (let ii = 0; ii < N; ii++) {
        const c = R.grid[ii][d];
        if (isFixed(c) || c.shifts.includes(s) || c.shifts.length >= 2) continue;
        opts.push(ii);
      }
      if (!opts.length) continue;
      i = pick(rnd, opts);
      const cell = R.grid[i][d];
      sv.push(snap(cell)); touched.push([i, d]);
      const next = cell.shifts.length === 1 ? [cell.shifts[0], s] : [s];
      setShifts(cell, next);
      cell.locked = false;
    } else {
      i = (rnd() * N) | 0;
      d = (rnd() * D) | 0;
      const cell = R.grid[i][d];
      if (isFixed(cell)) continue;
      sv.push(snap(cell)); touched.push([i, d]);
      const r = rnd();
      if (r < 0.4) setShifts(cell, [pick(rnd, active)]);
      else if (r < 0.7) setOff(cell, OFF.FILLED);
      else if (r < 0.9 && cell.shifts.length === 1) {
        const other = active.filter((x) => x !== cell.shifts[0]);
        if (!other.length) { touched.pop(); sv.pop(); continue; }
        setShifts(cell, [cell.shifts[0], pick(rnd, other)]);
      } else clearCell(cell);
    }

    const last = D - 1;
    const ok = cellHardOK(R, rules, i, d)
      && coverageMaxOK(R, rules, d)
      && (d <= 0 || cellHardOK(R, rules, i, d - 1))
      && (d >= last || cellHardOK(R, rules, i, d + 1));

    let accept = false;
    if (ok) {
      const c = cost(R, rules).total;
      if (c <= curCost) { curCost = c; accept = true; if (c < bestCost) { bestCost = c; best = cloneRoster(R); } }
    }
    if (!accept) {
      for (let t = touched.length - 1; t >= 0; t--) {
        const [ti, td] = touched[t];
        restore(R.grid[ti][td], sv[t]);
      }
    }
  }
  return { roster: best, cost: bestCost };
}

// ---------------------------------------------------------------------------
// 3) จัดช่องว่างที่เหลือ — ลำดับความสำคัญ:
//    A) ปิด coverage ให้ถึงขั้นต่ำของทุกกะทุกวันก่อน (สำคัญสุด — คนไข้ต้องมีคนดูแล)
//    B) แล้วค่อยเติม O ให้ถึงโควตาหยุด
//    C) ช่องว่างที่เหลือ → เวร (ถ้ายังไม่ถึงเพดาน) มิฉะนั้น O
// ---------------------------------------------------------------------------
function fillRest(R, rules) {
  const active = rules.activeShifts.filter((s) => isShiftActive(rules, s));
  const D = R.days;
  const N = R.staff.length;

  const emptyAt = (i, d) => {
    const c = R.grid[i][d];
    return !c.locked && c.off === null && c.shifts.length === 0;
  };
  const byLoad = (list) => list
    .map((i) => ({ i, k: loadOf(R.grid[i]) }))
    .sort((a, b) => a.k - b.k)
    .map((x) => x.i);

  // ---- A) coverage ก่อน ----
  for (let d = 0; d < D; d++) {
    for (const s of FILL_ORDER) {
      if (!active.includes(s)) continue;
      let guard = 0;
      while (assignedCount(R, d, s) < bandForDay(R, rules, d, s).min && guard++ < N * 2) {
        let placed = false;
        // 1) คนที่ช่องวันนั้นว่าง
        const free = [];
        for (let i = 0; i < N; i++) if (emptyAt(i, d)) free.push(i);
        for (const i of byLoad(free)) {
          if (tryPut(R, rules, i, d, [s])) { placed = true; break; }
        }
        // 2) ยังไม่พอ → ให้คนที่ทำงานกะเดียวอยู่แล้วขึ้นเป็น 2 กะ/วัน
        if (!placed) {
          const one = [];
          for (let i = 0; i < N; i++) {
            const c = R.grid[i][d];
            if (!c.locked && c.shifts.length === 1 && !c.shifts.includes(s)) one.push(i);
          }
          for (const i of byLoad(one)) {
            if (tryPut(R, rules, i, d, [R.grid[i][d].shifts[0], s])) { placed = true; break; }
          }
        }
        if (!placed) break; // จัดไม่ได้จริง ๆ (เช่นติดเพดานเวรติดกัน) — ปล่อยให้ report แจ้ง
      }
    }
  }

  // ---- B) เติม O ให้ถึงโควตาหยุด จากช่องที่ยังว่าง ----
  for (let i = 0; i < N; i++) {
    const row = R.grid[i];
    let lockedRest = 0;
    let rest = 0;
    let leave = 0;
    const empties = [];
    for (let d = 0; d < D; d++) {
      const c = row[d];
      if (c.off === OFF.LOCKED || c.off === OFF.FILLED) {
        rest += 1;
        if (c.locked) lockedRest += 1;
      } else if (c.off === OFF.LEAVE) {
        leave += 1;
      } else if (emptyAt(i, d)) {
        empties.push(d);
      }
    }
    const counted = rest + (rules.countLeaveInQuota ? leave : 0);
    // exact = ดันให้ถึงโควตา ; max = โควตาเป็นเพดาน ไม่ดัน
    const target = rules.offQuotaMode === 'exact'
      ? Math.max(lockedRest, rules.offQuota)
      : lockedRest;
    let need = target - counted;
    for (const d of empties) {
      if (need <= 0) break;
      row[d].off = OFF.FILLED;
      need -= 1;
    }
  }

  // ---- C) ช่องว่างที่เหลือ → เวร (ดูดซับ capacity) ไม่งั้น O ----
  for (let i = 0; i < N; i++) {
    for (let d = 0; d < D; d++) {
      if (!emptyAt(i, d)) continue;
      const c = R.grid[i][d];
      let placed = false;
      for (const s of active) {
        const band = bandForDay(R, rules, d, s);
        if (band.max != null && assignedCount(R, d, s) >= band.max) continue;
        const sv = snap(c);
        setShifts(c, [s]);
        const ok = cellHardOK(R, rules, i, d)
          && (d <= 0 || cellHardOK(R, rules, i, d - 1))
          && (d >= D - 1 || cellHardOK(R, rules, i, d + 1));
        if (ok) { placed = true; break; }
        restore(c, sv);
      }
      if (!placed) c.off = OFF.FILLED;
    }
  }
}

// ---------------------------------------------------------------------------
// 4) เกลี่ยวันหยุด O+R ให้ทุกคนใกล้โควตา (ย้ายเวรจากคนหยุดน้อย → คนหยุดเยอะ)
//    coverage ไม่เปลี่ยน เพราะเป็นการสลับเวรระหว่างคนในวันเดียวกัน
// ---------------------------------------------------------------------------
function balanceRest(R, rules) {
  const D = R.days;
  const N = R.staff.length;

  const restTarget = (i) => {
    let lr = 0;
    for (const c of R.grid[i]) if (c.locked && (c.off === OFF.LOCKED || c.off === OFF.FILLED)) lr += 1;
    return Math.max(lr, rules.offQuota);
  };
  const restCount = (i) => {
    let n = 0;
    for (const c of R.grid[i]) if (c.off === OFF.LOCKED || c.off === OFF.FILLED) n += 1;
    return n;
  };

  const trySwap = (over, under) => {
    for (let d = 0; d < D; d++) {
      const co = R.grid[over][d];
      const cu = R.grid[under][d];
      if (co.locked || cu.locked) continue;
      if (co.off !== OFF.FILLED) continue;      // over ต้องเป็น O ที่ระบบเติม
      if (cu.shifts.length !== 1) continue;     // under ทำงานกะเดียว
      const s = cu.shifts[0];
      const svo = snap(co);
      const svu = snap(cu);
      setShifts(co, [s]); co.locked = false;
      setOff(cu, OFF.FILLED); cu.locked = false;
      const ok = cellHardOK(R, rules, over, d)
        && (d <= 0 || cellHardOK(R, rules, over, d - 1))
        && (d >= D - 1 || cellHardOK(R, rules, over, d + 1))
        && (d <= 0 || cellHardOK(R, rules, under, d - 1))
        && (d >= D - 1 || cellHardOK(R, rules, under, d + 1));
      if (ok) return true;
      restore(co, svo);
      restore(cu, svu);
    }
    return false;
  };

  for (let guard = 0; guard < N * D; guard++) {
    const overs = [];
    const unders = [];
    for (let i = 0; i < N; i++) {
      const diff = restCount(i) - restTarget(i);
      if (diff > 0) overs.push(i);
      else if (diff < 0) unders.push(i);
    }
    if (!overs.length || !unders.length) break;

    let moved = false;
    for (const over of overs) {
      for (const under of unders) {
        if (trySwap(over, under)) { moved = true; break; }
      }
      if (moved) break;
    }
    if (!moved) break;
  }
}

// ---------------------------------------------------------------------------
// 5) ปิดช่องว่างวันหยุด: คนที่ยังหยุดไม่ถึงโควตา ยกกะเดียวของเขาไปเป็น
//    กะที่ 2 ของเพื่อนร่วมกะวันนั้น (coverage คงเดิม) แล้วช่องนั้นกลายเป็น O
//    ใช้เฉพาะโหมด exact — โหมด max โควตาเป็นเพดาน หยุดไม่ถึงไม่ผิด
//
//    การเลือก "วัน" ของเวรคู่: กระจายให้สม่ำเสมอตลอดเดือน — วางจุดเป้าหมาย
//    (slots) ห่างเท่า ๆ กันตามจำนวนเวรคู่ที่ต้องเติม แล้วแต่ละรอบเลือกท่าที่
//    วันใกล้ slot ที่สุด บวกกับเลือก "คนรับ" (taker) ที่ยังโดนเวรคู่น้อย
//    และห่างจากเวรคู่เดิมของตัวเอง เพื่อไม่ให้กระจุกทั้งแกนเวลาและรายคน
// ---------------------------------------------------------------------------
function restViaDoubles(R, rules) {
  if (rules.offQuotaMode !== 'exact') return;
  const D = R.days;
  const N = R.staff.length;
  const active = rules.activeShifts.filter((s) => isShiftActive(rules, s));

  // coverage ต้องครบก่อน — ถ้าวอร์ดยังมีกะไหนคนไม่ถึงขั้นต่ำ อย่าเพิ่งไปเกลี่ยวันหยุด
  for (let d = 0; d < D; d++) {
    for (const s of active) {
      if (assignedCount(R, d, s) < bandForDay(R, rules, d, s).min) return;
    }
  }

  const isRestCell = (c) => c.off === OFF.LOCKED || c.off === OFF.FILLED;
  const lockedRestOf = (i) => R.grid[i].reduce((n, c) => n + (c.locked && isRestCell(c) ? 1 : 0), 0);
  const restCount = (i) => R.grid[i].reduce((n, c) => n + (isRestCell(c) ? 1 : 0), 0);
  const targetOf = (i) => Math.max(lockedRestOf(i), rules.offQuota);

  const neighborsRest = (i, d) => {
    const a = d > 0 && isRestCell(R.grid[i][d - 1]);
    const b = d < D - 1 && isRestCell(R.grid[i][d + 1]);
    return (a ? 1 : 0) + (b ? 1 : 0);
  };

  // ใครยังหยุดไม่ถึงโควตา + รวมต้องเติมกี่เวรคู่
  const needs = [];
  let K = 0;
  for (let i = 0; i < N; i++) {
    const need = targetOf(i) - restCount(i);
    if (need > 0) { needs.push({ i, need }); K += need; }
  }
  if (K === 0) return;

  // สถานะเวรคู่ปัจจุบัน (นับของเดิมจาก constructive/polish ด้วย)
  const takerDbl = Array.from({ length: N }, () => 0);
  const takerDblDays = Array.from({ length: N }, () => []);
  for (let q = 0; q < N; q++) {
    R.grid[q].forEach((c, d) => {
      if (c.shifts.length >= 2) { takerDbl[q] += 1; takerDblDays[q].push(d); }
    });
  }

  // จุดเป้าหมายกระจายทั้งเดือน (index วัน 0-based)
  const slots = [];
  for (let k = 0; k < K; k++) slots.push(Math.round((k + 0.5) / K * D - 0.5));

  // ตรวจว่า q รับกะ s เป็นกะที่ 2 ในวัน d ได้ไหม (dry-run)
  const takerOK = (q, d, s) => {
    const cq = R.grid[q][d];
    if (q < 0 || cq.locked || cq.shifts.length !== 1 || cq.shifts.includes(s)) return false;
    const svq = snap(cq);
    setShifts(cq, [cq.shifts[0], s]); cq.locked = false;
    const ok = cellHardOK(R, rules, q, d)
      && (d <= 0 || cellHardOK(R, rules, q, d - 1))
      && (d >= D - 1 || cellHardOK(R, rules, q, d + 1));
    restore(cq, svq);
    return ok;
  };

  // คนรับที่ดีที่สุดในวัน d สำหรับกะ s: เวรคู่น้อย + ห่างจากเวรคู่เดิมของตัวเอง
  const bestTaker = (i, d, s) => {
    let best = -1;
    let bestScore = Infinity;
    for (let q = 0; q < N; q++) {
      if (q === i || !takerOK(q, d, s)) continue;
      const near = takerDblDays[q].reduce((m, dd) => Math.min(m, Math.abs(dd - d)), Infinity);
      const score = takerDbl[q] * 10 + (near < 7 ? 7 - near : 0);
      if (score < bestScore) { bestScore = score; best = q; }
    }
    return best;
  };

  const applyMove = (i, d, q) => {
    const ci = R.grid[i][d];
    const cq = R.grid[q][d];
    const svi = snap(ci);
    const svq = snap(cq);
    setShifts(cq, [cq.shifts[0], ci.shifts[0]]); cq.locked = false;
    setOff(ci, OFF.FILLED); ci.locked = false;
    const ok = cellHardOK(R, rules, q, d)
      && (d <= 0 || cellHardOK(R, rules, q, d - 1))
      && (d >= D - 1 || cellHardOK(R, rules, q, d + 1))
      && (d <= 0 || cellHardOK(R, rules, i, d - 1))
      && (d >= D - 1 || cellHardOK(R, rules, i, d + 1));
    if (ok) { takerDbl[q] += 1; takerDblDays[q].push(d); return true; }
    restore(ci, svi); restore(cq, svq);
    return false;
  };

  // เดินทีละ slot — แต่ละรอบเลือกท่าที่วันใกล้ slot ที่สุด (ทุกคนที่ยังขาด)
  for (const slot of slots) {
    let pick = null;
    let pickScore = Infinity;
    for (const entry of needs) {
      if (entry.need <= 0) continue;
      const i = entry.i;
      for (let d = 0; d < D; d++) {
        const ci = R.grid[i][d];
        if (ci.locked || ci.shifts.length !== 1) continue;
        const q = bestTaker(i, d, ci.shifts[0]);
        if (q < 0) continue;
        const score = Math.abs(d - slot) * 4 + neighborsRest(i, d) * 2 + takerDbl[q] * 3;
        if (score < pickScore) { pickScore = score; pick = { entry, d, q }; }
      }
    }
    if (pick && applyMove(pick.entry.i, pick.d, pick.q)) pick.entry.need -= 1;
  }

  // เผื่อบาง slot หาท่าไม่ได้ — ไล่เก็บคนที่ยังขาดแบบตรงไปตรงมา
  for (const entry of needs) {
    while (entry.need > 0) {
      let moved = false;
      for (let d = 0; d < D && !moved; d++) {
        const ci = R.grid[entry.i][d];
        if (ci.locked || ci.shifts.length !== 1) continue;
        const q = bestTaker(entry.i, d, ci.shifts[0]);
        if (q >= 0 && applyMove(entry.i, d, q)) { entry.need -= 1; moved = true; }
      }
      if (!moved) break;
    }
  }
}

// ---------------------------------------------------------------------------
// solve
// ---------------------------------------------------------------------------
/**
 * @param {object} roster
 * @param {object} rules
 * @param {{seed?:number, iterations?:number}} [opts]
 * @returns {{roster:object, cost:object, filled:number, changed:number}}
 */
function solve(roster, rules, opts = {}) {
  const rnd = mulberry32(opts.seed ?? 1);
  const iterations = opts.iterations ?? 6000;
  const R = cloneRoster(roster);
  if (R.staff.length === 0) return { roster: R, cost: cost(R, rules), filled: 0, changed: 0 };

  constructive(R, rules, rnd);
  const polished = polish(R, rules, rnd, iterations);
  const out = polished.roster;
  fillRest(out, rules);
  balanceRest(out, rules);
  restViaDoubles(out, rules);
  balanceRest(out, rules);

  // นับช่องที่เปลี่ยนจากต้นฉบับ
  let filled = 0;
  let changed = 0;
  for (let i = 0; i < roster.staff.length; i++) {
    for (let d = 0; d < roster.days; d++) {
      const a = roster.grid[i][d];
      const b = out.grid[i][d];
      const wasEmpty = a.shifts.length === 0 && a.off === null;
      const tokA = a.shifts.join('+') || a.off || '';
      const tokB = b.shifts.join('+') || b.off || '';
      if (tokA !== tokB) { changed++; if (wasEmpty) filled++; }
    }
  }

  return { roster: out, cost: cost(out, rules), filled, changed };
}


// ============================================================================
// csv.js — นำเข้า/ส่งออก CSV (เปิด/บันทึกผ่าน Excel ได้ตรง ๆ)
//
// JS บริสุทธิ์ ห้ามแตะ DOM
//
// รูปแบบ:  แถวแรก = "ชื่อ",1,2,3,...,D   (หัวเป็นเลขวันที่)
//          แถวถัดไป = ชื่อพยาบาล, token แต่ละวัน (ว่าง = ช่องว่าง)
//   token: ช บ ด | ช+บ / ชบ (2 กะ/วัน) | R O V T
//   แถวสรุป/รวมท้ายไฟล์ (ขึ้นต้นด้วย "รวม"/"ขึ้นเวร"/"หยุด") จะถูกข้าม
// ============================================================================



/** แยกข้อความ CSV → array ของ array (รองรับฟิลด์ในเครื่องหมายคำพูด) */
function parseCsv(text) {
  let s = String(text);
  if (s.charCodeAt(0) === 0xFEFF) s = s.slice(1); // ตัด BOM
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inQuotes) {
      if (c === '"') {
        if (s[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
      } else field += c;
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\r') {
      /* ข้าม */
    } else if (c === '\n') {
      row.push(field); rows.push(row); row = []; field = '';
    } else {
      field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const FOOTER_RE = /^(รวม|ขึ้นเวร|หยุด|เป้า|โควตา)/;

/**
 * CSV → { days, staff:[{name, locked:{day:token}}] }
 * (ส่งต่อเข้า parseRoster ได้เลย)
 */
function csvToStaffGrid(text) {
  const rows = parseCsv(text).filter((r) => r.some((c) => c.trim() !== ''));
  if (rows.length < 2) throw new Error('CSV ต้องมีหัวตาราง + อย่างน้อย 1 แถว');

  const header = rows[0];
  // นับคอลัมน์วันที่จากหัวที่เป็นตัวเลขติดกันหลังคอลัมน์แรก
  let days = 0;
  for (let i = 1; i < header.length; i++) {
    if (/^\d+$/.test(header[i].trim())) days++;
    else break;
  }
  if (days === 0) days = header.length - 1;
  if (days < 1 || days > 31) throw new Error(`จำนวนวันจาก CSV ไม่ถูกต้อง: ${days}`);

  const staff = [];
  for (let r = 1; r < rows.length; r++) {
    const cells = rows[r];
    const name = (cells[0] || '').trim();
    if (!name || FOOTER_RE.test(name)) continue;
    const locked = {};
    for (let d = 0; d < days; d++) {
      const tok = (cells[d + 1] || '').trim();
      if (tok) locked[String(d + 1)] = tok;
    }
    staff.push({ name, locked });
  }
  if (!staff.length) throw new Error('CSV ไม่พบแถวพยาบาล');
  return { days, staff };
}

/** roster → ข้อความ CSV (มี BOM ให้ Excel อ่านภาษาไทยถูก) */
function rosterToCsv(roster) {
  const esc = (v) => (/[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : String(v));
  const head = ['ชื่อ'];
  for (let d = 1; d <= roster.days; d++) head.push(String(d));
  const lines = [head.map(esc).join(',')];

  roster.staff.forEach((s, si) => {
    const row = [s.name];
    for (let d = 0; d < roster.days; d++) row.push(cellToToken(roster.grid[si][d]) || '');
    lines.push(row.map(esc).join(','));
  });
  return '﻿' + lines.join('\r\n');
}


// ============================================================================
// xlsx.js — ส่งออกตารางเวรเป็นไฟล์ Excel (.xlsx) โดยไม่พึ่งไลบรารีภายนอก
//
// JS บริสุทธิ์ ห้ามแตะ DOM — คืน Uint8Array (UI เอาไปห่อ Blob เอง)
//
// .xlsx = ZIP (แบบ "stored" ไม่บีบอัด) ที่บรรจุไฟล์ XML ตามสเปก OOXML:
//   [Content_Types].xml, _rels/.rels, xl/workbook.xml,
//   xl/_rels/workbook.xml.rels, xl/styles.xml, xl/worksheets/sheet1.xml
// ============================================================================




// ---------------------------------------------------------------------------
// CRC32 + ZIP (stored)
// ---------------------------------------------------------------------------
const CRC32_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC32_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function u8concat(arrays) {
  let len = 0;
  for (const a of arrays) len += a.length;
  const out = new Uint8Array(len);
  let o = 0;
  for (const a of arrays) { out.set(a, o); o += a.length; }
  return out;
}
const u16 = (n) => new Uint8Array([n & 255, (n >>> 8) & 255]);
const u32 = (n) => new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]);

/** files: [{ name, bytes:Uint8Array }] → Uint8Array ของ zip */
function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  const put = (a) => { parts.push(a); offset += a.length; };

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const crc = crc32(f.bytes);
    const size = f.bytes.length;
    const localAt = offset;
    put(u8concat([
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0),
    ]));
    put(nameBytes);
    put(f.bytes);
    central.push(u8concat([
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21),
      u32(crc), u32(size), u32(size),
      u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0),
      u32(localAt), nameBytes,
    ]));
  }

  const cdAt = offset;
  let cdSize = 0;
  for (const c of central) { put(c); cdSize += c.length; }
  put(u8concat([
    u32(0x06054b50), u16(0), u16(0),
    u16(central.length), u16(central.length),
    u32(cdSize), u32(cdAt), u16(0),
  ]));

  return u8concat(parts);
}

// ---------------------------------------------------------------------------
// XML helper
// ---------------------------------------------------------------------------
function xmlEsc(s) {
  return String(s)
    // ตัด control char ที่ XML 1.0 ไม่รับ (เหลือ \t \n \r) — กัน .xlsx เปิดไม่ได้
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '')
    .replace(/[&<>"]/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    ));
}

/** เลขคอลัมน์ 1-based → ตัวอักษร (1→A, 27→AA) */
function colName(n) {
  let s = '';
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = (n - m - 1) / 26;
  }
  return s;
}

// ดัชนี style ใน cellXfs (ดู styles.xml ด้านล่าง)
const ST = {
  DEFAULT: 0, HEAD: 1, CENTER: 2, NAME: 3, WKND: 4,
  ch: 5, b: 6, d: 7, DBL: 8, R: 9, O: 10, V: 11, T: 12,
  TITLE: 13, FOOT: 14, SUM: 15,
};

function tokenStyle(tok, weekend) {
  if (!tok) return weekend ? ST.WKND : ST.CENTER;
  if (tok.includes('+')) return ST.DBL;
  return ST[tok] != null ? ST[tok] : ST.CENTER;
}

function cStr(ref, style, text) {
  if (text === '' || text == null) return `<c r="${ref}" s="${style}"/>`;
  return `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`;
}
function cNum(ref, style, n) {
  return `<c r="${ref}" s="${style}"><v>${n}</v></c>`;
}

// ---------------------------------------------------------------------------
// styles.xml
// ---------------------------------------------------------------------------
const FILL_RGB = [
  null, null,          // 0 none, 1 gray125 (สงวนไว้)
  'FFF2F2F2',          // 2 header
  'FFFDEDED',          // 3 weekend
  'FFFEF3C7',          // 4 ช
  'FFFFE4D5',          // 5 บ
  'FFDBEAFE',          // 6 ด
  'FFFDE68A',          // 7 2 กะ/วัน
  'FFF1F5F9',          // 8 R
  'FFE2E8F0',          // 9 O
  'FFF3E8FF',          // 10 V
  'FFDCFCE7',          // 11 T
];

function stylesXml() {
  const fills = FILL_RGB.map((rgb, i) => {
    if (i === 0) return '<fill><patternFill patternType="none"/></fill>';
    if (i === 1) return '<fill><patternFill patternType="gray125"/></fill>';
    return `<fill><patternFill patternType="solid"><fgColor rgb="${rgb}"/><bgColor indexed="64"/></patternFill></fill>`;
  }).join('');

  const align = (h) => `<alignment horizontal="${h}" vertical="center"/>`;
  const XF = (font, fill, border, h) =>
    `<xf numFmtId="0" fontId="${font}" fillId="${fill}" borderId="${border}" xfId="0" `
    + `applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">${align(h)}</xf>`;

  const cellXfs = [
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>', // 0 DEFAULT
    XF(1, 2, 1, 'center'),   // 1 HEAD
    XF(0, 0, 1, 'center'),   // 2 CENTER
    XF(1, 0, 1, 'left'),     // 3 NAME
    XF(0, 3, 1, 'center'),   // 4 WKND (ว่าง)
    XF(0, 4, 1, 'center'),   // 5 ช
    XF(0, 5, 1, 'center'),   // 6 บ
    XF(0, 6, 1, 'center'),   // 7 ด
    XF(1, 7, 1, 'center'),   // 8 2 กะ/วัน
    XF(0, 8, 1, 'center'),   // 9 R
    XF(0, 9, 1, 'center'),   // 10 O
    XF(0, 10, 1, 'center'),  // 11 V
    XF(0, 11, 1, 'center'),  // 12 T
